<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento - SpotiPobre</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #DDD0C8;
            --text-main: #323232;
            --card-bg: #FFFFFF;
            
            --text-hover: #1a1a1a;
            --border-color: #c9bbae;
            --item-bg: #fdfcfb;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 50px 20px;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 20px 40px rgba(50, 50, 50, 0.1);
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-main);
            margin-bottom: 30px;
            border-bottom: 3px solid var(--text-main);
            padding-bottom: 12px;
        }

        ul.user-list {
            list-style: none;
            padding: 0;
            margin: 0 0 35px 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        ul.user-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background-color: var(--item-bg);
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--text-main);
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        ul.user-list li:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(50, 50, 50, 0.08);
            border-color: var(--text-main);
        }

        .user-name {
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--text-main);
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-edit {
            background-color: transparent;
            color: var(--text-main);
            border-color: var(--text-main);
        }

        .btn-edit:hover {
            background-color: var(--bg-color);
        }

        .btn-delete {
            background-color: var(--text-main);
            color: var(--bg-color);
        }

        .btn-delete:hover {
            background-color: var(--text-hover);
            box-shadow: 0 4px 10px rgba(50, 50, 50, 0.2);
        }

        .btn-container {
            display: flex;
            gap: 15px;
        }

        .btn-add {
            background-color: var(--text-main);
            color: var(--bg-color);
            flex: 1;
            padding: 16px;
            font-size: 0.95rem;
            text-align: center;
            display: block;
        }

        .btn-add:hover {
            background-color: var(--text-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(50, 50, 50, 0.25);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 2px solid var(--text-main);
            flex: 1;
            padding: 16px;
            font-size: 0.95rem;
            text-align: center;
            display: block;
        }

        .btn-secondary:hover {
            background-color: var(--bg-color);
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Dashboard SpotiPobre</h1>

        <ul class="user-list">
            {{#vetUsuario}}
            <li>
                <span class="user-name">{{nome}}</span>
                <div class="actions">
                    <a href="/usuarios/tela_alterar/{{id}}" class="btn btn-edit">Alterar</a>
                    <a href="/usuarios/excluir/{{id}}" class="btn btn-delete">Excluir</a>
                </div>
            </li>
            {{/vetUsuario}}
        </ul>

        <div class="btn-container">
            <a href="/usuarios/tela_adicionar" class="btn btn-secondary">+ Novo Usuário</a>
            <a href="/playlists/tela_adicionar" class="btn btn-add">+ Nova Playlist</a>
        </div>
    </div>
</body>

</html>
