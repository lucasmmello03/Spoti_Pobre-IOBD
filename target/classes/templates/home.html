<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - SpotiPobre</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/app.css">
</head>

<body>
    <main class="page page--home">
        <section class="hero">
            <span class="eq eq--lg" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
            <h1 class="hero__title">SpotiPobre</h1>
            <p class="hero__sub">O seu catálogo musical de baixo orçamento</p>
        </section>

        <nav class="hub" aria-label="Menu principal">
            <a href="/dashboard" class="hub__card">
                <span class="hub__icon" aria-hidden="true">🎵</span>
                <span class="hub__title">Catálogo</span>
                <span class="hub__desc">Ouvir músicas</span>
            </a>

            <a href="/playlists/tela_listagem" class="hub__card">
                <span class="hub__icon" aria-hidden="true">📁</span>
                <span class="hub__title">Playlists</span>
                <span class="hub__desc">Listar</span>
            </a>

            <a href="/usuarios" class="hub__card">
                <span class="hub__icon" aria-hidden="true">👥</span>
                <span class="hub__title">Usuários</span>
                <span class="hub__desc">Gerenciar</span>
            </a>
        </nav>
    </main>
</body>

</html>
