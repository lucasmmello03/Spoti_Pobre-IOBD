<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Playlist - SpotiPobre</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/app.css">
</head>

<body>
    <div class="page page--narrow">
        <header class="topbar">
            <a href="/" class="brand">
                <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                SpotiPobre
            </a>
            <nav class="nav" aria-label="Menu principal">
                <a href="/dashboard">Catálogo</a>
                <a href="/playlists/tela_listagem" aria-current="page">Playlists</a>
                <a href="/usuarios">Usuários</a>
            </nav>
        </header>

        <div class="page-head">
            <div>
                <p class="eyebrow">Editar</p>
                <h1 class="page-title">Alterar Playlist</h1>
            </div>
        </div>

        <div class="panel">
            <form action="/playlists/alterar" method="post">
                <input type="hidden" name="id" value="{{playlist.id}}">

                <div class="field">
                    <label class="label" for="nome">Nome da Playlist</label>
                    <input type="text" id="nome" name="nome" class="input" value="{{playlist.nome}}" required>
                </div>

                <label class="switch">
                    <input type="checkbox" id="publica" name="publica" value="true" {{#playlist.publica}}checked{{/playlist.publica}}>
                    <span>Tornar playlist pública</span>
                </label>

                <div class="form-actions">
                    <a href="/playlists/tela_listagem" class="btn">Cancelar</a>
                    <button type="submit" class="btn btn--primary">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
