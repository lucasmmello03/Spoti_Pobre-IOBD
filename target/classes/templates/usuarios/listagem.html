<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Usuários - SpotiPobre</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/app.css">
</head>

<body>
    <div class="page">
        <header class="topbar">
            <a href="/" class="brand">
                <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                SpotiPobre
            </a>
            <nav class="nav" aria-label="Menu principal">
                <a href="/dashboard">Catálogo</a>
                <a href="/playlists/tela_listagem">Playlists</a>
                <a href="/usuarios" aria-current="page">Usuários</a>
            </nav>
        </header>

        <div class="page-head">
            <div>
                <p class="eyebrow">Cadastro</p>
                <h1 class="page-title">Usuários</h1>
            </div>
            <a href="/usuarios/tela_adicionar" class="btn btn--primary">+ Novo Usuário</a>
        </div>

        <ul class="list">
            {{#vetUsuario}}
            <li class="playlist">
                <div class="cover" aria-hidden="true">👤</div>

                <div class="playlist__info">
                    <span class="playlist__name">{{nome}}</span>
                </div>

                <div class="playlist__actions">
                    <a href="/usuarios/tela_alterar/{{id}}" class="btn btn--sm">Alterar</a>

                    <form action="/usuarios/excluir" method="post" class="inline-form"
                        onsubmit="return confirm('Tem certeza que deseja excluir este usuário?');">
                        <input type="hidden" name="id" value="{{id}}">
                        <button type="submit" class="btn btn--danger btn--sm">Excluir</button>
                    </form>
                </div>
            </li>
            {{/vetUsuario}}
        </ul>

        {{^vetUsuario}}
        <div class="empty">Nenhum usuário cadastrado no sistema.</div>
        {{/vetUsuario}}
    </div>
</body>

</html>
