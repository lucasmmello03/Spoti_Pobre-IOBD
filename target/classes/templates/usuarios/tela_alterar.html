<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Usuário - SpotiPobre</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/app.css">
</head>

<body>
    <div class="page page--narrow">
        <header class="topbar">
            <a href="/" class="brand">
                <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                SpotiPobre
            </a>
            <nav class="nav" aria-label="Menu principal">
                <a href="/dashboard">Catálogo</a>
                <a href="/playlists/tela_listagem">Playlists</a>
                <a href="/usuarios" aria-current="page">Usuários</a>
            </nav>
        </header>

        <div class="page-head">
            <div>
                <p class="eyebrow">Editar</p>
                <h1 class="page-title">Alterar Usuário</h1>
            </div>
        </div>

        <div class="panel">
            <form action="/usuarios/alterar" method="post">
                <input type="hidden" name="id" value="{{usuario.id}}">

                <div class="field">
                    <label class="label" for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" class="input" value="{{usuario.nome}}" required>
                </div>

                <div class="field">
                    <label class="label" for="email">E-mail</label>
                    <input type="email" id="email" name="email" class="input" value="{{usuario.email}}" required>
                </div>

                <div class="field">
                    <label class="label" for="senha">Nova Senha</label>
                    <input type="password" id="senha" name="senha" class="input" placeholder="Preencha apenas se quiser alterar">
                </div>

                <div class="field">
                    <label class="label" for="data_nascimento">Data de Nascimento</label>
                    <input type="date" id="data_nascimento" name="data_nascimento" class="input" value="{{usuario.dataNascimento}}" required>
                </div>

                <div class="form-actions">
                    <a href="/usuarios" class="btn">Voltar</a>
                    <button type="submit" class="btn btn--primary">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
