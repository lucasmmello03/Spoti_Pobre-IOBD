<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlists - SpotiPobre</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #DDD0C8;
            --text-main: #323232;
            --card-bg: #FFFFFF;
            --text-hover: #1a1a1a;
            --border-color: #c9bbae;
            --item-bg: #fdfcfb;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 50px 20px;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 20px 40px rgba(50, 50, 50, 0.1);
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-main);
            margin-bottom: 30px;
            border-bottom: 3px solid var(--text-main);
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-back {
            font-size: 0.8rem;
            text-decoration: none;
            padding: 8px 12px;
            border: 2px solid var(--text-main);
            color: var(--text-main);
            border-radius: 4px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background-color: var(--text-main);
            color: var(--bg-color);
        }

        ul.playlist-list {
            list-style: none;
            padding: 0;
            margin: 0 0 35px 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        ul.playlist-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background-color: var(--item-bg);
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--text-main);
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        ul.playlist-list li:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(50, 50, 50, 0.08);
            border-color: var(--text-main);
        }

        .playlist-info {
            display: flex;
            flex-direction: column;
        }

        .playlist-name {
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .playlist-meta {
            font-size: 0.85rem;
            color: #666;
            margin-top: 4px;
            font-weight: 600;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-right: 8px;
        }

        .badge-publica {
            background-color: var(--text-main);
            color: var(--bg-color);
        }

        .badge-privada {
            background-color: transparent;
            border: 1px solid var(--text-main);
            color: var(--text-main);
        }

        /* --- NOVAS CLASSES PARA OS BOTÕES DE AÇÃO --- */
        .actions {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            font-size: 0.75rem;
            text-decoration: none;
            padding: 6px 12px;
            border: 2px solid var(--text-main);
            color: var(--text-main);
            border-radius: 4px;
            font-weight: 800;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            background-color: var(--text-main);
            color: var(--card-bg);
        }

        .btn-delete {
            background-color: var(--text-main);
            color: var(--card-bg);
        }

        .btn-delete:hover {
            background-color: transparent;
            color: var(--text-main);
        }

        .btn-add {
            background-color: var(--text-main);
            color: var(--bg-color);
            width: 100%;
            padding: 16px;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            display: block;
            border-radius: 4px;
            transition: all 0.2s ease;
            text-transform: uppercase;
            box-sizing: border-box;
        }

        .btn-add:hover {
            background-color: var(--text-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(50, 50, 50, 0.25);
        }

        .empty-state {
            text-align: center;
            font-weight: 600;
            color: #666;
            padding: 20px;
        }

        .actions form {
            margin: 0;
        }

        button.btn-action {
            font-family: inherit;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>
            Playlists
            <a href="/" class="btn-back">Início</a>
        </h1>

        <ul class="playlist-list">
            {{#playlists}}
            <li>
                <div class="playlist-info">
                    <span class="playlist-name">{{nome}}</span>
                    <div class="playlist-meta">
                        {{#publica}}<span class="badge badge-publica">Pública</span>{{/publica}}
                        {{^publica}}<span class="badge badge-privada">Privada</span>{{/publica}}
                        Criada por: {{dono_nome}}
                    </div>
                </div>


                <div class="actions">
                    <a href="/playlists/tela_alterar/{{id}}" class="btn-action">Alterar</a>

                    <form action="/playlists/excluir" method="post"
                        onsubmit="return confirm('Tem certeza que deseja excluir esta playlist?');">
                        <input type="hidden" name="id" value="{{id}}">
                        <button type="submit" class="btn-action btn-delete">Excluir</button>
                    </form>
                </div>
            </li>
            {{/playlists}}

            {{^playlists}}
            <div class="empty-state">
                Nenhuma playlist cadastrada no sistema.
            </div>
            {{/playlists}}
        </ul>

        <a href="/playlists/nova" class="btn-add">+ Nova Playlist</a>
    </div>
</body>

</html>
